<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaleBlox • Complete Zaylento Viral Vault (35 Videos)</title>
  <style>
    :root {
      --bg: #090c15;
      --card: #131929;
      --accent: #ffd60a;
      --accent-cyan: #00f2fe;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --active-card: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(19, 25, 41, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #ffd60a, #ff9f0a);
      color: #000;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .stats-badge {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--accent-cyan);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 32px;
      padding: 28px 36px;
      max-width: 1750px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .player-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 90px;
      height: fit-content;
    }
    .phone-frame {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 9/16;
      background: #000;
      border-radius: 36px;
      overflow: hidden;
      border: 3px solid rgba(255, 214, 10, 0.4);
      position: relative;
      box-shadow: 0 16px 50px rgba(0,0,0,0.85);
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .player-meta {
      width: 100%;
      max-width: 380px;
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .pm-views { color: var(--accent); font-weight: 800; font-size: 1.15rem; margin-bottom: 4px; }
    .pm-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
    .pm-file { font-size: 0.8rem; color: var(--text-dim); }

    .library-col { display: flex; flex-direction: column; gap: 16px; }
    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      max-height: 80vh;
      overflow-y: auto;
      padding-right: 6px;
    }
    .v-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .v-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .v-card.active {
      border-color: var(--accent);
      background: var(--active-card);
      box-shadow: 0 0 20px rgba(255, 214, 10, 0.2);
    }
    .v-views-tag {
      background: rgba(255, 214, 10, 0.15);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 6px;
      align-self: flex-start;
      border: 1px solid rgba(255, 214, 10, 0.3);
    }
    .v-card-title { font-size: 0.9rem; font-weight: 700; line-height: 1.35; }
    .v-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>👑 TaleBlox Creator Studio</span>
      <span class="brand-badge">Complete Zaylento Vault</span>
    </div>
    <div class="stats-badge">🔥 All 35 Viral Episodes Downloaded Locally (1.7 GB)</div>
  </header>

  <div class="main-layout">
    
    <div class="player-col">
      <div class="phone-frame">
        <video id="vaultVideo" controls autoplay loop playsinline>
          <source id="videoSource" src="01_Rich_Live_Above_The_Clouds_Part1.mp4" type="video/mp4">
        </video>
      </div>
      <div class="player-meta">
        <div class="pm-views" id="activeViews">🔥 1,500,000 Views</div>
        <div class="pm-title" id="activeTitle">In This Town, The Rich Live Above the Clouds (Part 1)</div>
        <div class="pm-file" id="activeFile">📁 01_Rich_Live_Above_The_Clouds_Part1.mp4</div>
      </div>
    </div>

    <div class="library-col">
      <div>
        <input type="text" id="searchBar" class="search-box" placeholder="🔍 Search among all 35 viral stories (e.g. bunker, ninja, dark, monster, rich)..." oninput="filterCards()">
      </div>
      <div class="grid-cards" id="cardsGrid">
        <!-- Injected via JavaScript -->
      </div>
    </div>

  </div>

  <script>
    let videos = [];
    let currentIdx = 0;
    const vPlayer = document.getElementById("vaultVideo");
    const vSource = document.getElementById("videoSource");
    const activeViews = document.getElementById("activeViews");
    const activeTitle = document.getElementById("activeTitle");
    const activeFile = document.getElementById("activeFile");
    const grid = document.getElementById("cardsGrid");

    fetch("full_catalog.json")
      .then(r => r.json())
      .then(data => {
        videos = data;
        renderCards(videos);
      })
      .catch(() => {
        // Fallback if local fetch needs manual array
      });

    function loadCard(file, views, title, idx) {
      currentIdx = idx;
      vSource.src = file;
      vPlayer.load();
      vPlayer.play().catch(() => {});
      activeViews.textContent = `🔥 ${views}`;
      activeTitle.textContent = title;
      activeFile.textContent = `📁 ${file}`;
      document.querySelectorAll(".v-card").forEach((c, i) => {
        c.classList.toggle("active", i === idx);
      });
    }

    function renderCards(list) {
      grid.innerHTML = "";
      list.forEach((v, idx) => {
        const card = document.createElement("div");
        card.className = `v-card ${idx === currentIdx ? 'active' : ''}`;
        card.onclick = () => loadCard(v.file, v.views, v.title, idx);
        card.innerHTML = `
          <div>
            <div class="v-views-tag">#${v.rank} • ${v.views}</div>
            <div class="v-card-title" style="margin-top: 8px;">${v.title}</div>
          </div>
          <div class="v-card-footer">
            <span>💾 ${v.size_mb || 'HD'} MB</span>
            <span style="color: var(--accent); font-weight: 700;">▶ Play Video</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCards() {
      const q = document.getElementById("searchBar").value.toLowerCase();
      const filtered = videos.filter(v => v.title.toLowerCase().includes(q));
      renderCards(filtered);
    }
  </script>
</body>
</html>
