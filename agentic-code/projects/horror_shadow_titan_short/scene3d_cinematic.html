<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Midnight Colossus - Cinematic Horror Short</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #010204;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #010204;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      max-width: 56.25vh; /* Strict 9:16 aspect ratio */
      max-height: 177.78vw;
      aspect-ratio: 9 / 16;
      display: block;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }
    #vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(0, 3, 8, 0.75) 100%);
    }
    #subtitle-layer {
      position: absolute;
      bottom: 75px;
      left: 5%;
      width: 90%;
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }
    .sub-text {
      display: inline-block;
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 3px 6px #000, 0 0 15px rgba(0,0,0,0.9);
      background: rgba(4, 8, 16, 0.75);
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      transition: all 0.2s ease-out;
    }
    .sub-hl { color: #f1c40f; text-shadow: 0 0 12px rgba(241, 196, 15, 0.8); }
    .sub-danger { color: #ff3838; text-shadow: 0 0 14px rgba(255, 56, 56, 0.9); font-weight: 1000; }
    #player-controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 16, 26, 0.88);
      border: 1px solid #233144;
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      z-index: 30;
    }
    .ctrl-btn {
      background: #ff4757;
      border: none;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
    }
    .ctrl-btn:hover { background: #ff6b81; transform: scale(1.06); }
    #time-display {
      color: #cbd5e1;
      font-size: 13px;
      font-family: monospace;
      font-weight: 700;
      min-width: 95px;
      text-align: center;
    }
    #seek-slider {
      width: 250px;
      accent-color: #ff4757;
      cursor: pointer;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport-container">
    <canvas id="canvas3d"></canvas>
    <div id="vignette"></div>
    <div id="subtitle-layer">
      <div id="sub-box" class="sub-text"></div>
    </div>
    <div id="player-controls">
      <button id="play-btn" class="ctrl-btn">▶</button>
      <input type="range" id="seek-slider" min="0" max="55.6" step="0.1" value="0">
      <div id="time-display">00:00 / 00:55</div>
    </div>
    <audio id="horror-audio" src="./audio/horror_master_audio.wav" preload="auto"></audio>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ==========================================
    // 1. SCENE, RENDERER & CINEMATIC BLOOM
    // ==========================================
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(720, 1280, false);
    renderer.setPixelRatio(1.0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);
    scene.fog = new THREE.FogExp2(0x040812, 0.022);

    const camera = new THREE.PerspectiveCamera(56, 720 / 1280, 0.1, 400);

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(720, 1280),
      0.95, // bloom strength
      0.38, // bloom radius
      0.80  // bloom threshold
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // ==========================================
    // 2. PROCEDURAL HIGH-RES TEXTURES
    // ==========================================

    // A. Soft Radial Fog Sprite Texture
    function createCloudTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 4, 128, 128, 124);
      grad.addColorStop(0, 'rgba(160, 190, 230, 0.50)');
      grad.addColorStop(0.35, 'rgba(90, 125, 175, 0.22)');
      grad.addColorStop(0.7, 'rgba(40, 65, 100, 0.08)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }
    const cloudTexture = createCloudTexture();

    // B. Muddy Gravel Country Road with Tyre Ruts & Specular Puddles
    function createMuddyRoadTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');

      // Base damp earthy brown
      ctx.fillStyle = '#1c1510';
      ctx.fillRect(0, 0, 1024, 1024);

      // Gravel noise & mud speckles
      for (let i = 0; i < 40000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const shade = Math.floor(25 + Math.random() * 35);
        ctx.fillStyle = `rgb(${shade}, ${shade * 0.8}, ${shade * 0.6})`;
        ctx.fillRect(x, y, 1 + Math.random() * 2.5, 1 + Math.random() * 2.5);
      }

      // Dark wet tyre ruts down the road
      const gradL = ctx.createLinearGradient(280, 0, 420, 0);
      gradL.addColorStop(0, 'rgba(12, 8, 6, 0.7)');
      gradL.addColorStop(0.5, 'rgba(6, 4, 3, 0.95)');
      gradL.addColorStop(1, 'rgba(12, 8, 6, 0.7)');
      ctx.fillStyle = gradL;
      ctx.fillRect(280, 0, 140, 1024);

      const gradR = ctx.createLinearGradient(604, 0, 744, 0);
      gradR.addColorStop(0, 'rgba(12, 8, 6, 0.7)');
      gradR.addColorStop(0.5, 'rgba(6, 4, 3, 0.95)');
      gradR.addColorStop(1, 'rgba(12, 8, 6, 0.7)');
      ctx.fillStyle = gradR;
      ctx.fillRect(604, 0, 140, 1024);

      // Wet puddles with glistening sheen
      const drawPuddle = (cx, cy, rx, ry) => {
        const pGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, rx);
        pGrad.addColorStop(0, '#0a0d14');
        pGrad.addColorStop(0.7, '#13110d');
        pGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0.15, 0, Math.PI * 2);
        ctx.fill();
      };
      drawPuddle(350, 200, 70, 140);
      drawPuddle(670, 680, 80, 160);
      drawPuddle(512, 450, 50, 90);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 10);
      return tex;
    }

    // C. Weathered Dark Wooden Shiplap Planks for Cabins
    function createWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#18110b';
      ctx.fillRect(0, 0, 512, 512);

      for (let y = 0; y < 512; y += 38) {
        ctx.fillStyle = (y / 38) % 2 === 0 ? '#22170f' : '#1c130d';
        ctx.fillRect(0, y, 512, 36);

        ctx.fillStyle = 'rgba(8, 4, 2, 0.5)';
        for (let j = 0; j < 6; j++) {
          const gy = y + Math.random() * 34;
          ctx.fillRect(0, gy, 512, 1 + Math.random() * 2);
        }
        ctx.fillStyle = '#060302';
        ctx.fillRect(0, y + 36, 512, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 4);
      return tex;
    }

    // D. Illuminated Cabin Window with Wooden Mullions
    function createWindowTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#140c06';
      ctx.fillRect(0, 0, 256, 256);

      const drawPane = (px, py, pw, ph) => {
        const grad = ctx.createRadialGradient(px + pw / 2, py + ph / 2, 4, px + pw / 2, py + ph / 2, pw * 0.7);
        grad.addColorStop(0, '#ffc048');
        grad.addColorStop(0.5, '#ffa502');
        grad.addColorStop(1, '#c25e00');
        ctx.fillStyle = grad;
        ctx.fillRect(px, py, pw, ph);

        // Curtains silhouette
        ctx.fillStyle = 'rgba(20, 10, 5, 0.45)';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.bezierCurveTo(px + pw * 0.35, py + ph * 0.3, px + pw * 0.15, py + ph, px, py + ph);
        ctx.fill();
      };
      drawPane(18, 18, 100, 100);
      drawPane(138, 18, 100, 100);
      drawPane(18, 138, 100, 100);
      drawPane(138, 138, 100, 100);

      ctx.fillStyle = '#110804';
      ctx.fillRect(118, 10, 20, 236);
      ctx.fillRect(10, 118, 236, 20);
      return new THREE.CanvasTexture(c);
    }

    // E. Red & Black Buffalo Check Flannel Texture
    function createFlannelTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const step = 32;
      for (let y = 0; y < 256; y += step) {
        for (let x = 0; x < 256; x += step) {
          const row = Math.floor(y / step) % 2;
          const col = Math.floor(x / step) % 2;
          if (row === 0 && col === 0) ctx.fillStyle = '#8a1f1f';
          else if (row === 1 && col === 1) ctx.fillStyle = '#151515';
          else ctx.fillStyle = '#521414';
          ctx.fillRect(x, y, step, step);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    // ==========================================
    // 3. AUTHENTIC ROBLOX DYNAMIC FACIAL ANIMATION
    // ==========================================

    // Dynamic 1024x1024 Canvas for The Boy's Scared Face
    const boyFaceCanvas = document.createElement('canvas');
    boyFaceCanvas.width = 1024;
    boyFaceCanvas.height = 1024;
    const boyFaceCtx = boyFaceCanvas.getContext('2d');
    const boyFaceTex = new THREE.CanvasTexture(boyFaceCanvas);

    function renderDynamicBoyFace(t, actIndex) {
      const ctx = boyFaceCtx;
      ctx.clearRect(0, 0, 1024, 1024);

      // Warm authentic Roblox peach skin tone
      ctx.fillStyle = '#f3c59e';
      ctx.fillRect(0, 0, 1024, 1024);

      // Subtle cheek blush
      const blushL = ctx.createRadialGradient(260, 610, 10, 260, 610, 150);
      blushL.addColorStop(0, 'rgba(220, 105, 95, 0.45)');
      blushL.addColorStop(1, 'rgba(220, 105, 95, 0)');
      ctx.fillStyle = blushL;
      ctx.beginPath(); ctx.arc(260, 610, 150, 0, Math.PI * 2); ctx.fill();

      const blushR = ctx.createRadialGradient(764, 610, 10, 764, 610, 150);
      blushR.addColorStop(0, 'rgba(220, 105, 95, 0.45)');
      blushR.addColorStop(1, 'rgba(220, 105, 95, 0)');
      ctx.fillStyle = blushR;
      ctx.beginPath(); ctx.arc(764, 610, 150, 0, Math.PI * 2); ctx.fill();

      // Natural Blinking Cycle (every ~3.2s)
      const blinkCycle = t % 3.2;
      const isBlinking = blinkCycle < 0.16;
      const blinkAmount = isBlinking ? Math.sin((blinkCycle / 0.16) * Math.PI) : 0;

      // Gaze Tracking
      let gazeX = 0, gazeY = 0;
      let pupilR = 34;

      if (actIndex === 1) {
        gazeX = Math.sin(t * 1.8) * 18;
        gazeY = Math.cos(t * 1.1) * 8;
        pupilR = 34;
      } else if (actIndex === 2) {
        gazeX = -26; gazeY = -28; pupilR = 44;
      } else if (actIndex === 3) {
        gazeX = Math.sin(t * 14.0) * 6; gazeY = -14; pupilR = 52;
      } else if (actIndex === 4) {
        gazeX = 0; gazeY = -36; pupilR = 58;
      } else {
        // Terrified sprint eye darts
        gazeX = Math.sin(t * 8.0) * 28;
        gazeY = 0;
        pupilR = 60;
      }

      // Render Authentic Roblox Cartoon Eyes
      const drawRobloxEye = (cx, cy) => {
        // Eye ambient socket
        ctx.fillStyle = 'rgba(175, 125, 95, 0.28)';
        ctx.beginPath(); ctx.ellipse(cx, cy, 110, 125, 0, 0, Math.PI * 2); ctx.fill();

        // Crisp White Sclera with Bold Black Rim
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(cx, cy, 95, 115, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#180e07'; ctx.lineWidth = 14; ctx.stroke();

        if (actIndex >= 3) {
          ctx.strokeStyle = 'rgba(225, 35, 35, 0.4)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(cx - 75, cy); ctx.lineTo(cx - 35, cy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx + 75, cy); ctx.lineTo(cx + 35, cy); ctx.stroke();
        }

        // Iris
        const ix = cx + gazeX, iy = cy + gazeY;
        ctx.fillStyle = '#3a2012';
        ctx.beginPath(); ctx.ellipse(ix, iy, 65, 85, 0, 0, Math.PI * 2); ctx.fill();

        // Inner Amber Glow
        ctx.fillStyle = '#7a4220';
        ctx.beginPath(); ctx.ellipse(ix, iy + 4, 46, 62, 0, 0, Math.PI * 2); ctx.fill();

        // Dilated Black Pupil
        ctx.fillStyle = '#080402';
        ctx.beginPath(); ctx.ellipse(ix, iy + 4, pupilR * 0.78, pupilR, 0, 0, Math.PI * 2); ctx.fill();

        // Dual Glossy Catchlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ix - 24, iy - 26, 26, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ix + 24, iy + 30, 13, 0, Math.PI * 2); ctx.fill();

        // Eyelid Blinking
        if (blinkAmount > 0.05) {
          ctx.fillStyle = '#f3c59e';
          ctx.beginPath();
          ctx.rect(cx - 105, cy - 125, 210, 250 * blinkAmount);
          ctx.fill();
          ctx.strokeStyle = '#62321c'; ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(cx - 100, cy - 125 + 250 * blinkAmount);
          ctx.lineTo(cx + 100, cy - 125 + 250 * blinkAmount);
          ctx.stroke();
        }
      };

      drawRobloxEye(320, 420);
      drawRobloxEye(704, 420);

      // Eyebrows (Thick, Arched, Terrified)
      ctx.strokeStyle = '#1a0d06';
      ctx.lineWidth = 26;
      ctx.lineCap = 'round';

      if (actIndex === 1) {
        ctx.beginPath(); ctx.moveTo(220, 280); ctx.lineTo(420, 296); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(804, 280); ctx.lineTo(604, 296); ctx.stroke();
      } else if (actIndex === 2) {
        ctx.beginPath(); ctx.moveTo(215, 290); ctx.lineTo(420, 230); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(809, 290); ctx.lineTo(604, 230); ctx.stroke();
      } else if (actIndex === 3 || actIndex === 4) {
        const tw = Math.sin(t * 16.0) * 6;
        ctx.beginPath(); ctx.moveTo(220, 310 + tw); ctx.lineTo(425, 250); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(804, 310 + tw); ctx.lineTo(599, 250); ctx.stroke();
      } else {
        // High-tension terror arch in Act 5
        const ptw = Math.sin(t * 22.0) * 8;
        ctx.beginPath(); ctx.moveTo(210, 320 + ptw); ctx.lineTo(430, 220); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(814, 320 + ptw); ctx.lineTo(594, 220); ctx.stroke();
      }

      // Stylized Roblox Nose Dots
      ctx.fillStyle = '#8c5230';
      ctx.beginPath(); ctx.arc(496, 560, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(528, 560, 6, 0, Math.PI * 2); ctx.fill();

      // Living Animated Mouth
      if (actIndex === 1) {
        const breath = Math.sin(t * 3.5) * 4;
        ctx.strokeStyle = '#3e1a0d'; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(436, 760 + breath); ctx.quadraticCurveTo(512, 772 + breath, 588, 760 + breath); ctx.stroke();
      } else if (actIndex === 2) {
        // Parted gasping mouth
        ctx.fillStyle = '#1c0808';
        ctx.beginPath(); ctx.ellipse(512, 760, 78, 58, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3a1212'; ctx.lineWidth = 10; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(468, 720, 88, 24);
      } else if (actIndex === 3) {
        const ch = Math.sin(t * 26.0) * 6;
        ctx.fillStyle = '#180404';
        ctx.beginPath(); ctx.ellipse(512, 760, 84, 46 + ch, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3a1212'; ctx.lineWidth = 10; ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(460, 736, 104, 20);
        ctx.fillRect(468, 768 + ch, 88, 16);
      } else if (actIndex === 4) {
        ctx.fillStyle = '#140202';
        ctx.beginPath(); ctx.ellipse(512, 765, 96, 84, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#441010'; ctx.lineWidth = 12; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(452, 700, 120, 32);
      } else {
        // ICONIC ROBLOX SCREAMING MOUTH (Act 5 matching reel!)
        const screamJaw = 150 + Math.sin(t * 16.0) * 28;
        ctx.fillStyle = '#120202';
        ctx.beginPath(); ctx.ellipse(512, 770, 116, screamJaw, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3e0c0c'; ctx.lineWidth = 14; ctx.stroke();

        // Upper & Lower Teeth Rows
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(436, 770 - screamJaw + 20, 152, 44);
        ctx.fillRect(448, 770 + screamJaw - 52, 128, 36);

        // Pink screaming tongue
        ctx.fillStyle = '#c73333';
        ctx.beginPath(); ctx.arc(512, 770 + screamJaw * 0.35, 68, 0, Math.PI); ctx.fill();

        // Cold sweat beads
        ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
        [
          { x: 290, y: 260, r: 8 }, { x: 310, y: 284, r: 6 },
          { x: 750, y: 250, r: 9 }, { x: 724, y: 280, r: 6 }
        ].forEach(sw => {
          ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.fill();
        });
      }

      boyFaceTex.needsUpdate = true;
    }

    // Dynamic 512x512 Canvas for Old Man Miller's Shouting Face
    const millerFaceCanvas = document.createElement('canvas');
    millerFaceCanvas.width = 512;
    millerFaceCanvas.height = 512;
    const millerFaceCtx = millerFaceCanvas.getContext('2d');
    const millerFaceTex = new THREE.CanvasTexture(millerFaceCanvas);

    function renderDynamicMillerFace(t) {
      const ctx = millerFaceCtx;
      ctx.clearRect(0, 0, 512, 512);

      ctx.fillStyle = '#ebd0b0';
      ctx.fillRect(0, 0, 512, 512);

      // Wrinkles
      ctx.strokeStyle = 'rgba(120, 75, 45, 0.45)';
      ctx.lineWidth = 4;
      [75, 95, 115].forEach(y => {
        ctx.beginPath(); ctx.moveTo(130, y); ctx.quadraticCurveTo(256, y - 10, 382, y); ctx.stroke();
      });

      // Wide Frantic Shouting Eyes
      const drawMillerEye = (cx) => {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(cx, 195, 40, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1a0e08'; ctx.lineWidth = 6; ctx.stroke();

        ctx.fillStyle = '#3a6ea5';
        ctx.beginPath(); ctx.arc(cx - 3, 195, 20, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#060302';
        ctx.beginPath(); ctx.arc(cx - 3, 195, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(cx - 10, 187, 8, 0, Math.PI * 2); ctx.fill();
      };
      drawMillerEye(175);
      drawMillerEye(337);

      // Bushy White Eyebrows
      ctx.fillStyle = '#e8ecf0';
      ctx.beginPath(); ctx.moveTo(115, 150); ctx.lineTo(235, 175); ctx.lineTo(215, 130); ctx.fill();
      ctx.beginPath(); ctx.moveTo(397, 150); ctx.lineTo(277, 175); ctx.lineTo(297, 130); ctx.fill();

      // Frantic Open Shouting Mouth
      const mouthOpen = 48 + Math.sin(t * 12.0) * 16;
      ctx.fillStyle = '#120202';
      ctx.beginPath(); ctx.ellipse(256, 355, 62, mouthOpen, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4a1515'; ctx.lineWidth = 7; ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(205, 355 - mouthOpen + 8, 102, 22);
      ctx.fillRect(215, 355 + mouthOpen - 26, 82, 18);
      ctx.fillStyle = '#ba3030';
      ctx.beginPath(); ctx.arc(256, 355 + mouthOpen * 0.35, 34, 0, Math.PI); ctx.fill();

      // Bushy Mustache
      ctx.fillStyle = '#e8ecf0';
      ctx.beginPath();
      ctx.moveTo(256, 265);
      ctx.bezierCurveTo(200, 260, 130, 290, 110, 320);
      ctx.bezierCurveTo(150, 310, 220, 295, 256, 290);
      ctx.bezierCurveTo(292, 295, 362, 310, 402, 320);

    const titanFangsMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xeeeeee,
      emissiveIntensity: 1.2,
      roughness: 0.2
    });

    // Dedicated Monster Face Illumination (makes the terrifying needle teeth & face pop!)
    const titanFaceLight = new THREE.DirectionalLight(0x99ccff, 3.5);
    titanFaceLight.position.set(0, 6, 18);
    colossus.add(titanFaceLight);

    // Slender Towering Torso Hierarchy
    const titanTorso = new THREE.Group();
    titanTorso.position.y = 12.0;
    colossus.add(titanTorso);

    const torsoMesh = new THREE.Mesh(new THREE.CapsuleGeometry(2.1, 7.5, 6, 12), titanBodyMat);
    torsoMesh.castShadow = true;
    titanTorso.add(torsoMesh);

    // Titan Head (Mounted on TOP of torso so it never gets obscured!)
    const titanHead = new THREE.Group();
    titanHead.position.set(0, 5.4, 0.8);
    titanTorso.add(titanHead);

    const headBase = new THREE.Mesh(new THREE.BoxGeometry(2.6, 4.0, 2.4), titanBodyMat);
    headBase.castShadow = true;
    titanHead.add(headBase);

    // Deep Recessed Dark Mouth Cavity
    const mouthCavity = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 1.8, 1.0),
      new THREE.MeshBasicMaterial({ color: 0x020000 })
    );
    mouthCavity.position.set(0, -0.65, 1.15);
    titanHead.add(mouthCavity);

    // Upper Row of Sharp Jagged Needle Teeth
    for (let i = -0.95; i <= 0.95; i += 0.22) {
      const topFang = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.75, 4), titanFangsMat);
      topFang.position.set(i, 0.22, 1.48);
      topFang.rotation.x = Math.PI; // points down!
      titanHead.add(topFang);
    }

    // Lower Row of Sharp Jagged Needle Teeth on Articulated Jaw
    const titanJaw = new THREE.Group();
    titanJaw.position.set(0, -1.2, 0.4);
    titanHead.add(titanJaw);

    const jawChin = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.85, 2.0), titanBodyMat);
    jawChin.position.set(0, -0.4, 0.35);
    titanJaw.add(jawChin);

    for (let i = -0.95; i <= 0.95; i += 0.22) {
      const botFang = new THREE.Mesh(new THREE.ConeGeometry(0.10, 0.75, 4), titanFangsMat);
      botFang.position.set(i, 0.24, 1.25);
      titanJaw.add(botFang);
    }

    const mawLight = new THREE.PointLight(0xff1100, 12.0, 16);
    mawLight.position.set(0, 0.2, 0.8);
    titanJaw.add(mawLight);

    // Crisp white mouth light highlighting the needle teeth
    const teethLight = new THREE.PointLight(0xffffff, 8.0, 10);
    teethLight.position.set(0, -0.65, 1.6);
    titanHead.add(teethLight);

    // Twin Piercing Glowing Crimson Eyes
    const titanEyeMat = new THREE.MeshStandardMaterial({
      color: 0xff0022,
      emissive: 0xff0022,
      emissiveIntensity: 8.5,
      roughness: 0.1
    });

    const eyeMeshL = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), titanEyeMat);
    eyeMeshL.position.set(-0.75, 0.95, 1.25);
    titanHead.add(eyeMeshL);

    const eyeMeshR = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), titanEyeMat);
    eyeMeshR.position.set(0.75, 0.95, 1.25);
    titanHead.add(eyeMeshR);

    const eyePointL = new THREE.PointLight(0xff1122, 11.0, 30);
    eyePointL.position.set(-0.75, 0.95, 1.4);
    titanHead.add(eyePointL);

    const eyePointR = new THREE.PointLight(0xff1122, 11.0, 30);
    eyePointR.position.set(0.75, 0.95, 1.4);
    titanHead.add(eyePointR);

    // Twin Forward Crimson Spotlights
    const eyeSpotL = new THREE.SpotLight(0xff1e2b, 18.0, 95, Math.PI / 4.5, 0.4);
    eyeSpotL.position.set(-0.75, 1.0, 1.5);
    eyeSpotL.target.position.set(-0.75, -5.0, 35.0);
    titanHead.add(eyeSpotL);
    titanHead.add(eyeSpotL.target);

    const eyeSpotR = new THREE.SpotLight(0xff1e2b, 18.0, 95, Math.PI / 4.5, 0.4);
    eyeSpotR.position.set(0.75, 1.0, 1.5);
    eyeSpotR.target.position.set(0.75, -5.0, 35.0);
    titanHead.add(eyeSpotR);
    titanHead.add(eyeSpotR.target);

    // Long Slender Claw Arms mounted to Torso shoulders
    const titanArmL = new THREE.Group();
    titanArmL.position.set(-3.2, 3.2, 0);
    titanTorso.add(titanArmL);

    const titanBicepL = new THREE.Mesh(new THREE.CapsuleGeometry(0.75, 4.2, 4, 8), titanBodyMat);
    titanBicepL.position.y = -2.4;
    titanBicepL.castShadow = true;
    titanArmL.add(titanBicepL);

    const titanForearmL = new THREE.Mesh(new THREE.CapsuleGeometry(0.68, 4.6, 4, 8), titanBodyMat);
    titanForearmL.position.y = -7.0;
    titanForearmL.castShadow = true;
    titanArmL.add(titanForearmL);

    // 5 Slender Needle Claws on Left Hand
    for (let c = -0.7; c <= 0.7; c += 0.35) {
      const claw = new THREE.Mesh(new THREE.ConeGeometry(0.18, 2.8, 4), titanBodyMat);
      claw.position.set(c, -10.5, 0.4);
      claw.rotation.x = 0.55;
      titanArmL.add(claw);
    }

    const titanArmR = new THREE.Group();
    titanArmR.position.set(3.2, 3.2, 0);
    titanTorso.add(titanArmR);

    const titanBicepR = new THREE.Mesh(new THREE.CapsuleGeometry(0.75, 4.2, 4, 8), titanBodyMat);
    titanBicepR.position.y = -2.4;
    titanBicepR.castShadow = true;
    titanArmR.add(titanBicepR);

    const titanForearmR = new THREE.Mesh(new THREE.CapsuleGeometry(0.68, 4.6, 4, 8), titanBodyMat);
    titanForearmR.position.y = -7.0;
    titanForearmR.castShadow = true;
    titanArmR.add(titanForearmR);

    for (let c = -0.7; c <= 0.7; c += 0.35) {
      const claw = new THREE.Mesh(new THREE.ConeGeometry(0.18, 2.8, 4), titanBodyMat);
      claw.position.set(c, -10.5, 0.4);
      claw.rotation.x = 0.55;
      titanArmR.add(claw);
    }

    // Long Slender Stomping Legs
    const titanLegL = new THREE.Group();
    titanLegL.position.set(-1.6, 9.8, 0);
    colossus.add(titanLegL);

    const titanThighL = new THREE.Mesh(new THREE.CapsuleGeometry(0.95, 4.8, 4, 8), titanBodyMat);
    titanThighL.position.y = -3.0;
    titanThighL.castShadow = true;
    titanLegL.add(titanThighL);

    const titanCalfL = new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 5.0, 4, 8), titanBodyMat);
    titanCalfL.position.y = -8.2;
    titanCalfL.castShadow = true;
    titanLegL.add(titanCalfL);

    const titanFootL = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.8), titanBodyMat);
    titanFootL.position.set(0, -10.8, 0.5);
    titanFootL.castShadow = true;
    titanLegL.add(titanFootL);

    const titanLegR = new THREE.Group();
    titanLegR.position.set(1.6, 9.8, 0);
    colossus.add(titanLegR);

    const titanThighR = new THREE.Mesh(new THREE.CapsuleGeometry(0.95, 4.8, 4, 8), titanBodyMat);
    titanThighR.position.y = -3.0;
    titanThighR.castShadow = true;
    titanLegR.add(titanThighR);

    const titanCalfR = new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 5.0, 4, 8), titanBodyMat);
    titanCalfR.position.y = -8.2;
    titanCalfR.castShadow = true;
    titanLegR.add(titanCalfR);

    const titanFootR = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.8), titanBodyMat);
    titanFootR.position.set(0, -10.8, 0.5);
    titanFootR.castShadow = true;
    titanLegR.add(titanFootR);

    // ==========================================
    // 7. MASTER TIMELINE DIRECTOR (55.6s @ 24fps)
    // ==========================================
    const subBox = document.getElementById('sub-box');

    window.renderFrameAtTime = function(t) {
      // 1. Lantern Flicker
      lanterns.forEach((l, idx) => {
        const flicker = Math.sin(t * 12 + idx * 2.3) * 0.35 + Math.cos(t * 22 + idx) * 0.2;
        l.light.intensity = l.origIntensity + flicker;
      });

      // 2. Mist Animation
      mistSprites.forEach((m, idx) => {
        m.position.x += Math.sin(t * 0.35 + idx) * 0.012;
      });

      // 3. Update Dust Particle Physics
      dustParticles.forEach(p => {
        if (p.age < p.maxAge) {
          p.age += 1.0 / 24.0;
          p.sprite.position.x += p.vx * 0.04;
          p.sprite.position.y += p.vy * 0.04;
          p.sprite.position.z += p.vz * 0.04;
          p.vy -= 1.8 * 0.04; // gravity
          const progress = p.age / p.maxAge;
          const currentScale = p.baseScale * (1.0 + progress * 1.4);
          p.sprite.scale.set(currentScale, currentScale * 0.8, 1.0);
          p.sprite.material.opacity = Math.max(0, 0.65 * (1.0 - progress));
        } else {
          p.sprite.material.opacity = 0;
        }
      });

      // ----------------------------------------------------
      // ACT 1: 0.0s - 11.0s | The Village Walk (Tracking Shot)
      // ----------------------------------------------------
      if (t < 11.0) {
        subBox.innerHTML = `BOY: <span class="sub-hl">"WHY IS EVERYONE HIDING? WHERE DID EVERYBODY GO?"</span>`;
        renderDynamicBoyFace(t, 1);

        const walkProg = t / 11.0;
        const curZ = 6.0 - walkProg * 20.0;
        boyRoot.position.set(0, 0, curZ);
        boyRoot.rotation.y = 0;

        const walkFreq = 5.2;
        const legSwing = Math.sin(t * walkFreq);
        const kneeBend = Math.max(0, -Math.sin(t * walkFreq));
        const kneeBendOpp = Math.max(0, Math.sin(t * walkFreq));

        boyLegL.rotation.x = legSwing * 0.55;
        kneeL.rotation.x = kneeBend * 0.8;
        boyLegR.rotation.x = -legSwing * 0.55;
        kneeR.rotation.x = kneeBendOpp * 0.8;

        boyArmL.rotation.x = -legSwing * 0.55;
        elbowL.rotation.x = -0.35 + Math.abs(legSwing) * 0.4;
        boyArmR.rotation.x = legSwing * 0.55;
        elbowR.rotation.x = -0.35 + Math.abs(legSwing) * 0.4;

        boyPelvis.position.y = 1.05 + Math.abs(Math.sin(t * walkFreq)) * 0.08;
        boyTorso.rotation.y = Math.sin(t * walkFreq) * 0.08;
        boyTorso.rotation.x = 0.08;
        boyNeck.rotation.set(0, Math.sin(t * 1.6) * 0.22, 0);

        camera.up.set(0, 1, 0);
        camera.position.set(0.8, 1.6, curZ - 4.2);
        camera.lookAt(0, 1.35, curZ + 0.5);

        colossus.position.set(0, -35, -50);
        titanJaw.rotation.x = 0;
        hermitArmL.rotation.x = 0;
        hermitArmR.rotation.x = 0;
      }

      // ----------------------------------------------------
      // ACT 2: 11.0s - 22.0s | Miller's Urgent Warning
      // ----------------------------------------------------
      else if (t < 22.0) {
        const localT = t - 11.0;
        if (localT < 6.0) {
          subBox.innerHTML = `OLD MAN MILLER: <span class="sub-danger">"TURN BACK, BOY! GET OFF THE ROAD! IT KNOWS WHEN SOMEONE'S OUTSIDE!"</span>`;
        } else {
          subBox.innerHTML = `BOY: <span class="sub-hl">"WHAT ARE YOU TALKING ABOUT?! WHAT KNOWS?!"</span>`;
        }
        renderDynamicBoyFace(t, 2);
        renderDynamicMillerFace(t);

        boyRoot.position.set(-0.8, 0, -14.0);
        const turnBlend = Math.min(1.0, localT / 1.2);
        boyRoot.rotation.y = -turnBlend * (Math.PI * 0.38);

        boyLegL.rotation.set(0, 0, 0); kneeL.rotation.set(0, 0, 0);
        boyLegR.rotation.set(0, 0, 0); kneeR.rotation.set(0, 0, 0);

        boyArmL.rotation.set(-0.85 + Math.sin(localT * 3.5) * 0.15, 0, -0.4);
        elbowL.rotation.set(-0.85, 0, 0);
        boyArmR.rotation.set(-0.85 + Math.cos(localT * 3.5) * 0.15, 0, 0.4);
        elbowR.rotation.set(-0.85, 0, 0);
        boyNeck.rotation.set(-0.48, Math.sin(localT * 2.0) * 0.15, 0);

        hermitArmL.rotation.x = -1.2 + Math.sin(localT * 10.0) * 0.85;
        hermitArmR.rotation.x = -1.4 + Math.cos(localT * 10.0) * 0.85;
        hermitHead.rotation.set(Math.sin(localT * 8.0) * 0.22, Math.sin(localT * 5.0) * 0.28, 0);

        camera.up.set(0, 1, 0);
        camera.position.set(0.2, 2.1, -11.5);
        camera.lookAt(-4.4, 3.6, -16.2);

        colossus.position.set(0, -35, -50);
        titanJaw.rotation.x = 0;
      }

      // ----------------------------------------------------
      // ACT 3: 22.0s - 33.0s | "THE CREATURE!" Over-The-Shoulder Reveal
      // ----------------------------------------------------
      else if (t < 33.0) {
        const localT = t - 22.0;
        subBox.innerHTML = `OLD MAN MILLER: <span class="sub-danger">"THE CREATURE! BEHIND YOU!"</span>`;
        renderDynamicBoyFace(t, 3);

        boyRoot.position.set(1.4, 0, -12.5);
        boyRoot.rotation.y = -0.15; // Boy framed on right side looking into deep forest

        const hbPhase = (localT % 0.85) / 0.85;
        const thud = Math.exp(-hbPhase * 12) * 0.18;

        boyLegL.rotation.set(0, 0, 0); kneeL.rotation.set(0, 0, 0);
        boyLegR.rotation.set(0, 0, 0); kneeR.rotation.set(0, 0, 0);
        boyArmL.rotation.set(-0.35 + thud * 0.5, 0, -0.3);
        boyArmR.rotation.set(-0.35 + thud * 0.5, 0, 0.3);
        boyNeck.rotation.set(0.18, 0, 0);

        // Slender Titan rises majestically out of the misty forest
        const riseProg = Math.min(1.0, localT / 11.0);
        const colossusY = -28.0 + riseProg * 28.0;
        colossus.position.set(0, colossusY, -36.0);
        colossus.rotation.y = 0;

        const growlProg = Math.max(0, Math.sin((localT - 5.0) * 1.5));
        titanJaw.rotation.x = growlProg * 0.30;
        mawLight.intensity = 10.0 + growlProg * 18.0;

        eyePointL.intensity = 11.0 + thud * 50.0;
        eyePointR.intensity = 11.0 + thud * 50.0;
        eyeSpotL.intensity = 16.0 + thud * 70.0;
        eyeSpotR.intensity = 16.0 + thud * 70.0;

        camera.up.set(0, 1, 0);
        camera.position.set(0.4, 1.45 + thud, -8.5);
        camera.lookAt(0, 8.8 + thud * 2.0, -36.0);
      }

      // ----------------------------------------------------
      // ACT 4: 33.0s - 44.0s | The Earth-Shattering Stomp & Roar
      // ----------------------------------------------------
      else if (t < 44.0) {
        const localT = t - 33.0;
        subBox.innerHTML = `A <span class="sub-danger">FORTY-FOOT SHADOW TITAN</span> CRASHES THROUGH THE PINES!`;
        renderDynamicBoyFace(t, 4);

        const boyBackZ = -14.0 + (localT / 11.0) * 6.0;
        boyRoot.position.set(0, 0, boyBackZ);
        boyRoot.rotation.y = 0;

        boyLegL.rotation.set(0, 0, 0); boyLegR.rotation.set(0, 0, 0);
        boyArmL.rotation.set(-0.4, 0, -0.5); boyArmR.rotation.set(-0.4, 0, 0.5);
        boyNeck.rotation.set(-0.55, 0, 0);

        const stompZ = -36.0 + (localT / 11.0) * 18.0;
        colossus.position.set(0, 0, stompZ);
        colossus.rotation.y = 0;

        const stompCycle = localT * 2.4;
        const titanSwing = Math.sin(stompCycle);
        const titanImpact = Math.pow(Math.abs(Math.sin(stompCycle)), 8);

        // Stomp dust explosion trigger
        if (titanImpact > 0.85) {
          triggerDustExplosion(titanSwing > 0 ? -1.6 : 1.6, 0, stompZ);
        }

        titanLegL.rotation.x = titanSwing * 0.65;
        titanLegR.rotation.x = -titanSwing * 0.65;
        titanArmL.rotation.set(-titanSwing * 0.6, 0, -0.3);
        titanArmR.rotation.set(titanSwing * 0.6, 0, 0.3);
        titanTorso.rotation.y = -titanSwing * 0.12;

        titanJaw.rotation.x = Math.max(0, Math.sin(localT * 3.2)) * 0.45;
        mawLight.intensity = 12.0 + Math.sin(localT * 3.2) * 22.0;

        camera.up.set(0, 1, 0);
        camera.position.set(-1.6, 0.85 + titanImpact * 0.35, -8.5);
        camera.lookAt(0.1, 8.5, stompZ - 2.0);
        camera.rotateZ(-0.12);
      }

      // ----------------------------------------------------
      // ACT 5: 44.0s - 55.6s | The Screaming Sprint Chase & Lunging Claws
      // ----------------------------------------------------
      else {
        const localT = t - 44.0;
        if (localT < 5.0) {
          subBox.innerHTML = `BOY: <span class="sub-danger">"NO! DON'T LOOK BACK—RUN!"</span>`;
        } else {
          subBox.innerHTML = `BOY: <span class="sub-danger">"HELP! SOMEBODY HELP ME!"</span>`;
        }
        renderDynamicBoyFace(t, 5);

        const sprintProg = localT / 11.6;
        const sprintZ = -8.0 + sprintProg * 32.0;
        boyRoot.position.set(0, 0, sprintZ);
        boyRoot.rotation.y = Math.PI; // Turns 180° to sprint towards camera!

        // High-Speed Athletic Sprint Cycle
        const runFreq = 16.0;
        const runSwing = Math.sin(localT * runFreq);
        const runKnee = Math.max(0, -Math.sin(localT * runFreq));
        const runKneeOpp = Math.max(0, Math.sin(localT * runFreq));

        boyLegL.rotation.x = runSwing * 0.95;
        kneeL.rotation.x = runKnee * 1.4;
        boyLegR.rotation.x = -runSwing * 0.95;
        kneeR.rotation.x = runKneeOpp * 1.4;

        boyArmL.rotation.x = -runSwing * 1.15;
        elbowL.rotation.x = -0.9 + Math.abs(runSwing) * 0.5;
        boyArmR.rotation.x = runSwing * 1.15;
        elbowR.rotation.x = -0.9 + Math.abs(runSwing) * 0.5;

        boyPelvis.position.y = 1.05 + Math.abs(Math.sin(localT * runFreq)) * 0.24;
        boyTorso.rotation.x = 0.32;
        boyNeck.rotation.set(-0.25, Math.sin(localT * 4) * 0.2, 0);

        // Towering Colossus Hot Pursuit!
        const titanZ = sprintZ - 13.5;
        colossus.position.set(0, 0, titanZ);
        colossus.rotation.y = 0;
        titanTorso.rotation.x = 0.32;

        const titanStepFreq = 6.5;
        const titanStep = Math.sin(localT * titanStepFreq);
        titanLegL.rotation.x = titanStep * 0.7;
        titanLegR.rotation.x = -titanStep * 0.7;

        if (Math.abs(titanStep) > 0.92) {
          triggerDustExplosion(titanStep > 0 ? -1.6 : 1.6, 0, titanZ);
        }

        // Long claw arms actively lunging forward to snatch the boy!
        titanArmL.rotation.set(-1.4 + Math.sin(localT * 6) * 0.35, 0, -0.2);
        titanArmR.rotation.set(-1.5 + Math.cos(localT * 6) * 0.35, 0, 0.2);

        // Head tilts menacingly forward staring directly down at camera & boy!
        titanHead.rotation.x = 0.32;
        titanJaw.rotation.x = 0.45 + Math.sin(localT * 8.0) * 0.20;
        mawLight.intensity = 26.0 + Math.sin(localT * 8.0) * 18.0;

        eyePointL.intensity = 16.0;
        eyePointR.intensity = 16.0;
        eyeSpotL.intensity = 26.0;
        eyeSpotR.intensity = 26.0;

        // Cinematic Chase Framing matching Instagram Reel:
        // Boy framed chest-up screaming in lower foreground; towering Needle-Toothed Colossus perfectly framed directly above!
        const chaseShakeX = (Math.random() - 0.5) * 0.16;
        const chaseShakeY = (Math.random() - 0.5) * 0.16;
        camera.up.set(0, 1, 0);
        camera.position.set(0.0 + chaseShakeX, 2.4 + chaseShakeY, sprintZ + 7.2);
        camera.lookAt(0, 7.8, sprintZ - 6.5);
        camera.rotateZ(Math.sin(localT * 12.0) * 0.05);
      }

      composer.render();
    };

    // ==========================================
    // 8. INTERACTIVE HTML5 CONTROLS & PLAYBACK
    // ==========================================
    const playBtn = document.getElementById('play-btn');
    const seekSlider = document.getElementById('seek-slider');
    const timeDisplay = document.getElementById('time-display');
    const audio = document.getElementById('horror-audio');
    const controls = document.getElementById('player-controls');
    let isPlaying = false;

    if (new URLSearchParams(window.location.search).has('record')) {
      controls.style.display = 'none';
    }

    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
        isPlaying = false;
      } else {
        audio.play().then(() => {
          playBtn.textContent = '⏸';
          isPlaying = true;
        }).catch(err => {
          console.warn('Audio play error:', err);
          isPlaying = true;
          playBtn.textContent = '⏸';
        });
      }
    });

    seekSlider.addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      audio.currentTime = t;
      window.renderFrameAtTime(t);
      timeDisplay.textContent = `${formatTime(t)} / 00:55`;
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.paused) {
        seekSlider.value = audio.currentTime;
        timeDisplay.textContent = `${formatTime(audio.currentTime)} / 00:55`;
        window.renderFrameAtTime(audio.currentTime);
      }
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.textContent = '▶';
    });

    // Initial render at t = 0
    window.renderFrameAtTime(0);
  </script>
</body>
</html>
