<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AniTrend — Discover and download trending anime videos from YouTube, Reddit, and more. Manage your content pipeline with a powerful anime video dashboard." />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AniTrend — Trending Anime Video Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Particle canvas background -->
      <canvas id="particles-canvas"></canvas>

      <!-- Sidebar Navigation -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
          <span class="logo-icon">⛩</span>
          <span class="logo-text">Ani<span class="logo-accent">Trend</span></span>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
            <span class="nav-icon">🔥</span>
            <span class="nav-label">Trending</span>
          </button>
          <button class="nav-item" data-view="queue" id="nav-queue">
            <span class="nav-icon">⬇️</span>
            <span class="nav-label">Queue</span>
            <span class="nav-badge" id="queue-badge" style="display:none">0</span>
          </button>
          <button class="nav-item" data-view="upload" id="nav-upload">
            <span class="nav-icon">📤</span>
            <span class="nav-label">Upload</span>
          </button>
          <button class="nav-item" data-view="settings" id="nav-settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span class="footer-text">Free APIs Only ✨</span>
        </div>
      </aside>

      <!-- Main Content -->
      <main id="main-content" class="main-content">
        <!-- Views injected here by JS -->
      </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none"></div>
    <div id="video-modal" class="video-modal" style="display:none"></div>
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
